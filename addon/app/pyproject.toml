[project]
name = "knx-yaml-to-ui-addon"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "knx-yaml-to-ui-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "websockets>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.sources]
knx-yaml-to-ui-core = { path = "../../shared", editable = true }
