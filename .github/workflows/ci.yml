name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shared-core:
    name: shared/knx_yaml_to_ui_core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install package
        run: uv pip install --system -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check knx_yaml_to_ui_core
      - name: Format check (ruff)
        run: ruff format --check knx_yaml_to_ui_core
      - name: Type check (mypy)
        run: mypy knx_yaml_to_ui_core
      - name: Test (pytest)
        run: pytest --cov=knx_yaml_to_ui_core --cov-report=xml --cov-fail-under=85

  addon-app:
    name: addon/app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install deps
        run: |
          uv pip install --system ../../shared
          uv pip install --system fastapi 'uvicorn[standard]' httpx websockets pyyaml
          uv pip install --system pytest pytest-asyncio pytest-cov ruff mypy
      - name: Install addon runtime deps
        run: |
          uv pip install --system aiosqlite pydantic
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy .

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install deps
        run: |
          uv pip install --system ../../shared
          uv pip install --system fastapi 'uvicorn[standard]' httpx websockets pyyaml aiosqlite
          uv pip install --system pytest pytest-asyncio pytest-cov
      - name: Run addon tests with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

  frontend:
    name: addon/web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: addon/web/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint (eslint)
        run: pnpm lint
      - name: Type check (tsc)
        run: pnpm typecheck
      - name: Build (vite)
        run: pnpm build
      - name: Check bundle size budget
        run: |
          total=$(find dist/assets -name '*.js' -exec gzip -c {} \; | wc -c)
          echo "Total JS gzipped: $total bytes"
          if [ "$total" -gt 204800 ]; then
            echo "Bundle exceeds 200 KB gzipped budget"
            exit 1
          fi

  addon-docker:
    name: addon/Dockerfile build (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare shared copy
        run: cp -r shared addon/shared
      - name: Build Docker image
        run: |
          docker build \
            -f addon/Dockerfile \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20 \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg BUILD_VERSION=0.0.1 \
            -t knx-yaml-to-ui:ci \
            addon/
